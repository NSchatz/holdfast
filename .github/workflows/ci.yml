name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned for reproducibility, and NOT free to be any 1.25.x: the gate below runs
  # govulncheck, which reports stdlib advisories against the toolchain it is running on.
  # So this must be at or above every `Fixed in` version govulncheck names for the
  # standard library, or the gate is red by construction. Raise it to a released patch,
  # never lower it, and let scripts/check-pins.sh (part of the gate) hold it equal to the
  # Dockerfile and release.yml.
  #
  # staticcheck/govulncheck are NOT pinned here: the gate below is `make check`, so the
  # Makefile owns those versions. They used to be pinned in both places, which meant a
  # Makefile bump left the PR gate and the release gate (which has always gone through
  # `make check`) silently running different tools — the same "duplicated and held in
  # step by hope" failure as the ffmpeg pin. One gate, defined once, run by CI, by the
  # release, and by a human typing `make check`.
  GO_VERSION: "1.25.14"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      # The engine safety proof drives REAL ffmpeg fixtures — it fails loud if
      # ffmpeg/ffprobe (or, for the VMAF gate, libvmaf) are missing (a skip would be a
      # false green). Ubuntu's apt ffmpeg does NOT ship libvmaf, so install the static
      # build that carries libx265 + libvmaf.
      #
      # The pin is READ OUT OF THE DOCKERFILE, never restated here. VMAF is the gate that
      # catches an encode which decodes fine but LOOKS worse, so the measuring instrument
      # drifting away from the one in the shipped image is not cosmetic — it is the proof
      # detaching from the artifact. Duplicating the pin and asking the next person to
      # keep the two in step is not a pin; parsing it is.
      - name: install ffmpeg (the pin the image ships; libx265 + libvmaf)
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/ffmpeg
          sudo chown "$USER" /opt/ffmpeg
          ./scripts/install-ffmpeg.sh /opt/ffmpeg
          echo "/opt/ffmpeg/bin" >> "$GITHUB_PATH"

      # The dashboard graders that concern what the page SHOWS load it in a real browser
      # engine, because the rows are built by script from a snapshot and reading the
      # source text cannot say what an operator sees. Resolve the browser HERE so its
      # absence is a named step failure rather than a puzzling red inside a Go test,
      # and so it fails loud rather than being skipped, which for a grader is a false
      # green. GitHub's runner images ship Chrome; this only locates it.
      #
      # The resolution is scripts/find-browser.sh, and it is a SCRIPT because this repeated
      # it: the `dashboard` job below carried a second, weaker copy that asked `command -v`
      # and printed a version, so the two jobs measured different engines and the weaker
      # answer was on the job that exists to make a missing browser fatal. One definition,
      # run by both jobs, by the release workflow and by a human typing `make find-browser`.
      #
      # The resolved path is assigned BEFORE it is echoed, deliberately: `echo "X=$(cmd)"`
      # exits 0 however cmd exited, so a failed resolution would write an empty pin and the
      # step would go green - and an empty HOLDFAST_BROWSER is not a pin at all, it is the
      # PATH search this step exists to replace.
      - name: browser for the rendered dashboard graders
        run: |
          set -euo pipefail
          p="$(./scripts/find-browser.sh)"
          [ -n "$p" ] || { echo "::error::the browser resolution produced no path"; exit 1; }
          echo "HOLDFAST_BROWSER=$p" >> "$GITHUB_ENV"

      # THE gate. Invoked through the Makefile, and deliberately NOT re-listed as steps
      # here: the Makefile's `check:` target is the definition, so CI, the release workflow
      # and a human run the identical gate, and adding to it lands in one file. (Restating
      # what it contains would just be one more copy to drift — the mistake this repo has
      # made with the ffmpeg pin, the tool pins, and the base image.)
      - name: make check (the gate)
        run: make check

      # The release-shape gate's own self-test, on top of the gate. `make check` runs the
      # GATE (scripts/release-shape-gate); this defeats it on purpose, once per way it
      # could fail silently, against mutated copies of release.yml, docker-compose.yml and
      # docs/release.md - so the mutations stay out of `check`, which must never rewrite
      # the tree it is grading. How MANY ways is `declared=` in the self-test, which is its
      # single writer and which the run prints; a number restated here would be one more
      # copy to drift, which is the mistake the comment above is about. Same reason the
      # config self-test below sits here: proving a gate REDS is a different assertion from
      # running it.
      - name: release-shape self-test (the gate must still bite)
        run: make release-shape-selftest

      # Config schema self-test (anti-advisory-only), on top of the gate: the committed
      # example must validate, and each known-invalid config must be REJECTED — one via
      # the schema (unknown key), one via value validation (out-of-range crf), so both
      # rejection paths are covered. Proves the `validate` subcommand + schema wire
      # together end to end, and that the gate actually REDS — not just that tests passed.
      - name: config schema self-test
        run: |
          set -euo pipefail
          go build -o /tmp/holdfast ./cmd/holdfast
          /tmp/holdfast validate --config config.example.yaml
          for bad in testdata/config-invalid.yaml testdata/config-invalid-value.yaml; do
            if /tmp/holdfast validate --config "$bad"; then
              echo "::error::invalid config $bad was ACCEPTED — schema gate is broken"; exit 1
            fi
          done
          echo "config schema self-test OK (valid accepted; unknown-key + bad-value rejected)"

  # The dashboard's own suites, in REQUIRED mode (WEBUI-10).
  #
  # `make check` above runs them with this repository's skip-when-absent idiom, so a
  # contributor with no browser is not blocked - the same courtesy the docker gate gets.
  # That idiom has exactly one failure mode: a suite that skips on every machine reports
  # "ok" forever while measuring nothing. This job closes it. HOLDFAST_WEBUI_REQUIRED=1
  # turns a missing runtime into a failure, and scripts/webui-check.sh fails the run if
  # anything skipped or if either half did not execute at all.
  #
  # It is a separate job because it needs runtimes the gate does not: node (for the
  # derivation units, in node's BUILT-IN test runner, and for the Playwright graders' own
  # runner) and a browser engine (for every grader that decides what the page SHOWS by
  # loading the served document rather than by matching its source text).
  #
  # The Playwright project is installed with `npm ci` from the committed lockfile, so what
  # CI runs is the runner version this repository pinned. It is TEST tooling and reaches
  # nothing a user runs: the generator is still Go and stdlib, `make build` is still a
  # plain `go build`, and the image gains no stage - which is not asked for here, it is
  # enforced by TestBuild_TheTestOnlyDependencyCannotReachTheBuiltArtifact inside the
  # gate. The browser is the runner's own; Playwright is told to use it rather than
  # downloading one, so no browser download enters this repository's CI.
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      # Named and proven present BEFORE the gate runs, so "the browser was missing" is a
      # sentence in the log rather than a mystery inside a test binary.
      #
      # PROVEN, which this step used to only claim. It asked `command -v` and printed a
      # `--version`, which every candidate answers - including the one that then never
      # paints - and it exported nothing, so the graders were left to search for themselves
      # and found the runner's /usr/bin/chromium. Two of them spent 90 seconds each waiting
      # on it, eight minutes into every run, while the identical graders were green in
      # `build` above, because `build` had pinned an engine it had watched render. The
      # resolution is one script now and it PINS what it proved, so both jobs measure the
      # same engine and the log says which.
      - name: the runtimes the dashboard suites require
        run: |
          set -euo pipefail
          node --version
          p="$(./scripts/find-browser.sh)"
          [ -n "$p" ] || { echo "::error::the browser resolution produced no path"; exit 1; }
          echo "HOLDFAST_BROWSER=$p" >> "$GITHUB_ENV"

      # The graders' runner, from the committed lockfile. `npm ci` REFUSES a lockfile that
      # disagrees with the manifest, which is what makes this a pin rather than a request.
      - name: the dashboard graders' test runner
        run: npm ci --no-audit --no-fund
        working-directory: internal/webui/e2e
        env:
          # The graders use the browser proved present above. Downloading a second one
          # would put an unpinned, undigested browser build in the path of a repository
          # whose entire packaging story is a pinned, digest-verified artifact.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: the dashboard's unit suite and rendered graders, in required mode
        run: make webui-check

      # The rendered graders must AGREE WITH THEMSELVES. The step above asks whether they
      # pass; this one runs them repeatedly against the one tree this job checked out and
      # fails if two repetitions decided the same bytes differently. It is here because
      # that is exactly how the defect it guards arrived: a grader whose verdict depended
      # on how loaded the runner was broke main, and the rerun that passed made it look
      # like nothing had happened. A rerun is not evidence when the thing being tested is
      # whether reruns agree.
      #
      # Repetitions cannot prove determinism, only fail to disprove it. The criteria that
      # remove the mechanism are graders inside the suite above - a reading held back for
      # two minutes, a snapshot held back past any budget the harness carries - and this
      # step is the cheap disconfirmation that runs beside them and catches a NEW clock
      # dependence introduced by someone who has read none of that.
      - name: the rendered graders must agree with themselves
        run: make webui-repeat-check

      # The engine-only graders' own self-test, on top of the gate. `make webui-check` RUNS
      # them; this defeats each of the three questions that exist only at the engine - the
      # operating system's colour-scheme preference, the accessible name the engine
      # computes, the focus a real key press moves - against a mutated COPY of the tree, and
      # fails if any defeat did not execute or came back green. Proving a grader REDS is a
      # different assertion from running it, and these three are the whole reason there is a
      # browser in this gate. It sits here rather than in `check` for the same reason the
      # release-shape self-test does: its mutations must not touch the tree `check` grades.
      - name: the engine-only graders must still bite
        run: make webui-graders-selftest

  # The packaging gate. It runs on every PR the same script the release workflow runs
  # before it pushes anything (scripts/smoke-image.sh), so the image a tag ships is the
  # image that has been gated all along.
  #
  # It does NOT check that the image built — that proves nothing about the engine. It
  # drives a REAL oneshot encode inside the built container with the bundled ffmpeg and
  # asserts the no-loss contract held: the source was replaced by a smaller HEVC file
  # that passed every gate, and no work-in-progress temp survived.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # QEMU is needed only to EXECUTE the arm64 image. Building it cross-compiles
      # (CGO_ENABLED=0, and no RUN in the runtime stage), so no emulation is involved.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: build the image (linux/amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: holdfast:ci
          build-args: |
            VERSION=0.0.0-ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
            DATE=1970-01-01T00:00:00Z
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test the image (real encode, real gate)
        run: ./scripts/smoke-image.sh holdfast:ci

      - name: build the image (linux/arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: holdfast:ci-arm64
          build-args: |
            VERSION=0.0.0-ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
            DATE=1970-01-01T00:00:00Z
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An encode under QEMU would be glacial — but "does the cross-built arm64 image
      # actually execute" (binary, glibc, bundled ffmpeg) is exactly what cross-building
      # gets wrong, and that is cheap to check.
      - name: smoke test the arm64 image (exec only, under QEMU)
        run: ./scripts/smoke-image.sh holdfast:ci-arm64 linux/arm64 --no-encode

      - name: the compose example must be valid
        run: docker compose -f docker-compose.yml config -q
