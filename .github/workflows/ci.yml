name: CI

# THE FULL GATE, nightly on main and by hand (workflow_dispatch): `make check` with
# internal/engine's real encodes, every selftest and the image smoke gate. CI is the only place
# the gate runs (the owner, 2026-10-03: "Holdfast and chorus NEED to use the public CI and
# nothing local"). A pull request does not wait for this: pr.yml runs only what its change
# touches (the owner's rule: changed-only, 2 minutes). A red nightly run is fixed on main.
on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref; the nightly run has a group of its own, so a dispatched
# run never cancels it.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

env:
  # Pinned for reproducibility, and NOT free to be any 1.26.x: the gate below runs
  # govulncheck, which reports stdlib advisories against the toolchain it is running on.
  # So this must be at or above every `Fixed in` version govulncheck names for the
  # standard library, or the gate is red by construction. Raise it to a released patch,
  # never lower it, and let scripts/check-pins.sh (part of the gate) hold it equal to the
  # Dockerfile and release.yml.
  #
  # staticcheck/govulncheck are NOT pinned here: the gate below is `make check`, so the
  # Makefile owns those versions. They used to be pinned in both places, which meant a
  # Makefile bump left the PR gate and the release gate (which has always gone through
  # `make check`) silently running different tools — the same "duplicated and held in
  # step by hope" failure as the ffmpeg pin. One gate, defined once, run by CI, by the
  # release, and by a human typing `make check`.
  GO_VERSION: "1.26.9"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The identity scan in `make check` reads the owner's identity from the
          # repository's FIRST commit, which a shallow checkout does not have (it
          # refuses one, exit 4, rather than scan for the wrong person).
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      # The web UI's gate (`make check`: ui-lint, ui-typecheck, ui-test, ui-build) runs on
      # the Node web/.node-version pins, READ from that file and never restated here
      # (scripts/check-pins.sh section 12 refuses a literal). pnpm is not installed by
      # this step: scripts/ui.sh takes it from corepack, which reads the version and the
      # sha512 of its package from web/package.json. No dependency cache: the install is seconds, and a
      # cache is one more thing that could hand the gate packages the lockfile did not name.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.node-version
          check-latest: false
          package-manager-cache: false

      # The engine safety proof drives REAL ffmpeg fixtures — it fails loud if
      # ffmpeg/ffprobe (or, for the VMAF gate, libvmaf) are missing (a skip would be a
      # false green). Ubuntu's apt ffmpeg does NOT ship libvmaf, so install the static
      # build that carries libx265 + libvmaf.
      #
      # The pin is READ OUT OF THE DOCKERFILE, never restated here. VMAF is the gate that
      # catches an encode which decodes fine but LOOKS worse, so the measuring instrument
      # drifting away from the one in the shipped image is not cosmetic — it is the proof
      # detaching from the artifact. Duplicating the pin and asking the next person to
      # keep the two in step is not a pin; parsing it is.
      - name: install ffmpeg (the pin the image ships; libx265 + libvmaf)
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/ffmpeg
          sudo chown "$USER" /opt/ffmpeg
          ./scripts/install-ffmpeg.sh /opt/ffmpeg
          echo "/opt/ffmpeg/bin" >> "$GITHUB_PATH"

      # The dynamic-HDR tools the image bundles (dovi_tool, hdr10plus_tool), installed the
      # same way: the pin is PARSED out of the Dockerfile's DOVI_TOOL_* and HDR10PLUS_TOOL_*
      # ARGs, each tarball's sha256 is checked before it is unpacked, and each binary must
      # print its pinned version, so the fixtures prove the metadata carry against the
      # tools the image ships.
      - name: install dovi_tool and hdr10plus_tool (the pins the image ships)
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/dynhdr-tools
          sudo chown "$USER" /opt/dynhdr-tools
          ./scripts/install-dynhdr-tools.sh /opt/dynhdr-tools
          echo "/opt/dynhdr-tools/bin" >> "$GITHUB_PATH"

      # THE gate. Invoked through the Makefile, and deliberately NOT re-listed as steps
      # here: the Makefile's `check:` target is the definition, so CI, the release workflow
      # and a human run the identical gate, and adding to it lands in one file. (Restating
      # what it contains would just be one more copy to drift — the mistake this repo has
      # made with the ffmpeg pin, the tool pins, and the base image.)
      - name: make check (the gate)
        run: make check

      # The happy-path log grader's own self-test (S0130). It is deliberately NOT in
      # `check`: it MUTATES a copy of the tree, and the gate must never grade a tree one
      # of its own members has written. It lives in THIS job because the grader drives a
      # real oneshot run - a real encode, a real VMAF measurement, a real swap - and this
      # is the job that installs the pinned ffmpeg with libx265 and libvmaf above.
      - name: happy-path log grader self-test
        run: make happy-path-log-selftest

      # The mutation gate's own self-test (S0133), and it is here for the same two reasons:
      # it MUTATES a copy of the tree, so it cannot ride `check`, and it drives the real
      # runner against real suites, so it belongs in the job that installs the pinned ffmpeg.
      # It is the only guard over the ways that gate goes silently GREEN - a report below the
      # floor read as a pass, an empty diff scope reported as a score of zero, a diff scope
      # that matched nothing, a red scheduled run whose notification never fired - and a
      # guard that runs only when somebody types the target is a guard nobody knows works.
      - name: mutation gate self-test
        run: make mutation-selftest

      # Config schema self-test (anti-advisory-only), on top of the gate: the committed
      # example must validate, and each known-invalid config must be REJECTED — one via
      # the schema (unknown key), one via value validation (out-of-range crf), and two
      # more for the shapes a library_roots ENTRY can be wrong in: a key inside an entry
      # that describes the process rather than a library, and a pair of roots where one
      # contains the other. All four rejection paths are covered. Proves the `validate`
      # subcommand + schema wire together end to end, and that the gate actually REDS —
      # not just that tests passed.
      - name: config schema self-test
        run: |
          set -euo pipefail
          go build -o /tmp/holdfast ./cmd/holdfast
          /tmp/holdfast validate --config config.example.yaml
          for bad in testdata/config-invalid.yaml testdata/config-invalid-value.yaml \
                     testdata/config-invalid-profile-key.yaml testdata/config-invalid-nested-roots.yaml; do
            if /tmp/holdfast validate --config "$bad"; then
              echo "::error::invalid config $bad was ACCEPTED — schema gate is broken"; exit 1
            fi
          done
          echo "config schema self-test OK (valid accepted; unknown-key, bad-value, daemon-level profile key and nested roots rejected)"

  # The packaging gate. It runs nightly (and on a PR that changes the image's inputs, pr.yml)
  # the same script the release workflow runs before it pushes anything (scripts/smoke-image.sh), so the image a tag ships is the
  # image that has been gated all along.
  #
  # It does NOT check that the image built — that proves nothing about the engine. It
  # drives a REAL oneshot encode inside the built container with the bundled ffmpeg and
  # asserts the no-loss contract held: the source was replaced by a smaller HEVC file
  # that passed every gate, and no work-in-progress temp survived.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU is needed only to EXECUTE the arm64 image. Building it cross-compiles
      # (CGO_ENABLED=0, and no RUN in the runtime stage), so no emulation is involved.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build the image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: holdfast:ci
          build-args: |
            VERSION=0.0.0-ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
            DATE=1970-01-01T00:00:00Z
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test the image (real encode, real gate)
        run: ./scripts/smoke-image.sh holdfast:ci

      - name: build the image (linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: holdfast:ci-arm64
          build-args: |
            VERSION=0.0.0-ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
            DATE=1970-01-01T00:00:00Z
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An encode under QEMU would be glacial — but "does the cross-built arm64 image
      # actually execute" (binary, glibc, bundled ffmpeg) is exactly what cross-building
      # gets wrong, and that is cheap to check.
      - name: smoke test the arm64 image (exec only, under QEMU)
        run: ./scripts/smoke-image.sh holdfast:ci-arm64 linux/arm64 --no-encode

      - name: the compose example must be valid
        run: docker compose -f docker-compose.yml config -q
