name: PR

# What a pull request waits for: only the checks and tests its change touches, in 2 minutes or
# less (the owner's rule). scripts/pr-scope.sh decides the scope from the diff against the base
# branch: the packages the change touches and every package that depends on them, and each
# check or selftest whose inputs changed. internal/engine's real-encode suite never runs here.
# The full gate, `make check` with internal/engine and every selftest, runs nightly on main
# (ci.yml), and by hand through its workflow_dispatch.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  # Held equal to the Dockerfile and the other workflows by scripts/check-pins.sh.
  GO_VERSION: "1.25.14"

jobs:
  # Seconds of work, so the test shards start almost at once.
  plan:
    runs-on: ubuntu-latest
    outputs:
      pkgs: ${{ steps.scope.outputs.pkgs }}
      vet: ${{ steps.scope.outputs.vet }}
      ui: ${{ steps.scope.outputs.ui }}
      check_pins_selftest: ${{ steps.scope.outputs.check_pins_selftest }}
      install_ffmpeg_selftest: ${{ steps.scope.outputs.install_ffmpeg_selftest }}
      install_dynhdr_selftest: ${{ steps.scope.outputs.install_dynhdr_selftest }}
      secret_scan_selftest: ${{ steps.scope.outputs.secret_scan_selftest }}
      identity_scan_selftest: ${{ steps.scope.outputs.identity_scan_selftest }}
      api_schema_diff: ${{ steps.scope.outputs.api_schema_diff }}
      api_schema_diff_selftest: ${{ steps.scope.outputs.api_schema_diff_selftest }}
      mutation_shape: ${{ steps.scope.outputs.mutation_shape }}
      mutation_selftest: ${{ steps.scope.outputs.mutation_selftest }}
      happy_path_selftest: ${{ steps.scope.outputs.happy_path_selftest }}
      govulncheck: ${{ steps.scope.outputs.govulncheck }}
      govulncheck_selftest: ${{ steps.scope.outputs.govulncheck_selftest }}
      config_selftest: ${{ steps.scope.outputs.config_selftest }}
      package: ${{ steps.scope.outputs.package }}
      pr_scope_selftest: ${{ steps.scope.outputs.pr_scope_selftest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The merge base with the base branch.
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false

      - name: scripts/pr-scope.sh
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          ./scripts/pr-scope.sh "origin/${BASE_REF}" | tee -a "$GITHUB_OUTPUT"

  # Everything but `go test`: the whole-tree scans, gofmt, the UI, vet, staticcheck, and each
  # check or selftest whose inputs changed.
  changed:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The merge base with the base branch, and the identity scan's first commit.
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      # Whole-tree and seconds each, so every PR runs them.
      - name: check-pins, secret-scan, identity-scan
        run: make check-pins secret-scan identity-scan

      - name: gofmt (changed Go files)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          files="$(git diff --name-only --diff-filter=d "$(git merge-base "origin/${BASE_REF}" HEAD)" HEAD -- '*.go')"
          [ -z "$files" ] && exit 0
          out="$(gofmt -l $files)"
          if [ -n "$out" ]; then echo "gofmt needs:"; echo "$out"; exit 1; fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.plan.outputs.ui == 'true'
        with:
          node-version-file: web/.node-version
          check-latest: false
          package-manager-cache: false

      - name: web UI (lint, typecheck, test, build)
        if: needs.plan.outputs.ui == 'true'
        run: make ui-lint ui-typecheck ui-test ui-build

      - name: build
        run: make build

      - name: vet and staticcheck (changed packages and their dependents)
        if: needs.plan.outputs.vet != ''
        env:
          PKGS: ${{ needs.plan.outputs.vet }}
        run: |
          set -euo pipefail
          go vet $PKGS
          go run "honnef.co/go/tools/cmd/staticcheck@$(sed -n 's/^STATICCHECK_VERSION *?= *//p' Makefile)" $PKGS

      - name: install ffmpeg (the pin the image ships; libx265 + libvmaf)
        if: needs.plan.outputs.happy_path_selftest == 'true' || needs.plan.outputs.mutation_selftest == 'true'
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/ffmpeg /opt/dynhdr-tools
          sudo chown "$USER" /opt/ffmpeg /opt/dynhdr-tools
          ./scripts/install-ffmpeg.sh /opt/ffmpeg
          ./scripts/install-dynhdr-tools.sh /opt/dynhdr-tools
          echo "/opt/ffmpeg/bin" >> "$GITHUB_PATH"
          echo "/opt/dynhdr-tools/bin" >> "$GITHUB_PATH"

      - name: api-schema-diff
        if: needs.plan.outputs.api_schema_diff == 'true'
        run: make api-schema-diff

      - name: govulncheck
        if: needs.plan.outputs.govulncheck == 'true'
        run: make govulncheck

      - name: config schema self-test
        if: needs.plan.outputs.config_selftest == 'true'
        run: |
          set -euo pipefail
          go build -o /tmp/holdfast ./cmd/holdfast
          /tmp/holdfast validate --config config.example.yaml
          for bad in testdata/config-invalid.yaml testdata/config-invalid-value.yaml \
                     testdata/config-invalid-profile-key.yaml testdata/config-invalid-nested-roots.yaml; do
            if /tmp/holdfast validate --config "$bad"; then
              echo "::error::invalid config $bad was ACCEPTED - schema gate is broken"; exit 1
            fi
          done

      # Each selftest runs when its own inputs changed (scripts/pr-scope.sh names them).
      - { name: check-pins-selftest,           if: needs.plan.outputs.check_pins_selftest == 'true',      run: make check-pins-selftest }
      - { name: install-ffmpeg-selftest,       if: needs.plan.outputs.install_ffmpeg_selftest == 'true',  run: make install-ffmpeg-selftest }
      - { name: install-dynhdr-tools-selftest, if: needs.plan.outputs.install_dynhdr_selftest == 'true',  run: make install-dynhdr-tools-selftest }
      - { name: secret-scan-selftest,          if: needs.plan.outputs.secret_scan_selftest == 'true',     run: make secret-scan-selftest }
      - { name: identity-scan-selftest,        if: needs.plan.outputs.identity_scan_selftest == 'true',   run: make identity-scan-selftest }
      - { name: api-schema-diff-selftest,      if: needs.plan.outputs.api_schema_diff_selftest == 'true', run: make api-schema-diff-selftest }
      - { name: mutation-shape,                if: needs.plan.outputs.mutation_shape == 'true',           run: make mutation-shape }
      - { name: mutation-selftest,             if: needs.plan.outputs.mutation_selftest == 'true',        run: make mutation-selftest }
      - { name: happy-path-log-selftest,       if: needs.plan.outputs.happy_path_selftest == 'true',      run: make happy-path-log-selftest }
      - { name: govulncheck-selftest,          if: needs.plan.outputs.govulncheck_selftest == 'true',     run: make govulncheck-selftest }
      - { name: pr-scope-selftest,             if: needs.plan.outputs.pr_scope_selftest == 'true',        run: ./scripts/pr-scope-selftest.sh }

  # `go test` of the changed packages and their dependents, in parallel shards
  # (scripts/pr-shard.sh): cmd/holdfast and internal/server are suites of real encodes too.
  test:
    needs: plan
    if: needs.plan.outputs.pkgs != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - name: install ffmpeg and the dynamic-HDR tools (the pins the image ships)
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/ffmpeg /opt/dynhdr-tools
          sudo chown "$USER" /opt/ffmpeg /opt/dynhdr-tools
          ./scripts/install-ffmpeg.sh /opt/ffmpeg
          ./scripts/install-dynhdr-tools.sh /opt/dynhdr-tools
          echo "/opt/ffmpeg/bin" >> "$GITHUB_PATH"
          echo "/opt/dynhdr-tools/bin" >> "$GITHUB_PATH"

      # A web/ change: the binary's tests read the UI this tree builds, as `make check` does.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.plan.outputs.ui == 'true'
        with:
          node-version-file: web/.node-version
          check-latest: false
          package-manager-cache: false

      - name: build the web UI
        if: needs.plan.outputs.ui == 'true'
        run: make ui-build

      - name: go test (shard ${{ matrix.shard }} of 8)
        env:
          PKGS: ${{ needs.plan.outputs.pkgs }}
        run: ./scripts/pr-shard.sh ${{ matrix.shard }} 8 $PKGS

  # The image smoke gate, only when the image's own inputs changed; nightly runs it always.
  package:
    needs: plan
    if: needs.plan.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: build the image (linux/amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: holdfast:ci
          build-args: |
            VERSION=0.0.0-ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
            DATE=1970-01-01T00:00:00Z
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test the image (real encode, real gate)
        run: ./scripts/smoke-image.sh holdfast:ci

      - name: build the image (linux/arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: holdfast:ci-arm64
          build-args: |
            VERSION=0.0.0-ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
            DATE=1970-01-01T00:00:00Z
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test the arm64 image (exec only, under QEMU)
        run: ./scripts/smoke-image.sh holdfast:ci-arm64 linux/arm64 --no-encode

      - name: the compose example must be valid
        run: docker compose -f docker-compose.yml config -q

  # The PR's wall time, first job start to last job end. Warns (never fails) past 2 minutes.
  elapsed:
    needs: [plan, changed, test, package]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: elapsed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          t0="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
            --jq '[.jobs[] | select(.name != "elapsed") | .started_at | fromdate] | min')"
          s=$(( $(date +%s) - t0 ))
          echo "PR checks: ${s} s"
          echo "PR checks: ${s} s" >> "$GITHUB_STEP_SUMMARY"
          if [ "$s" -gt 120 ]; then echo "::warning::PR checks took ${s} s, over the 2-minute budget"; fi
