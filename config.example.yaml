# holdfast — example configuration (config-as-code).
#
# Copy to config.yaml (gitignored) and edit. Validate it any time with:
#   holdfast validate --config config.yaml
#
# Every knob below has a sensible default and may be omitted. Any value can be
# overridden by an environment variable named HOLDFAST_<KEY> (e.g. HOLDFAST_CRF=20,
# HOLDFAST_LOG_LEVEL=debug) — env wins over the file. An unknown key here is a hard
# error (typo protection).
#
# Running in a container? Three keys change: library_roots and state_dir become the
# paths you MOUNTED, and server_addr must be 0.0.0.0 (127.0.0.1 inside a container
# namespace is unreachable from the host — publish the port on loopback instead).
# See docs/docker.md.

# Directory trees to scan and re-encode files under. This is the ONLY place holdfast
# ever mutates the filesystem, so it is validated strictly: each root must be absolute
# and must not be "/" or your home directory.
#
# AN ENTRY IS EITHER A PATH OR A PATH WITH A PROFILE. Write a bare path and that root
# uses every setting below. Write a mapping with `path` plus any of the per-library
# knobs and that root uses those instead, for those knobs only - everything it does not
# name it inherits.
#
# The inheritance is three layers, innermost last:
#   built-in default  <-  this file's top level (then HOLDFAST_*)  <-  the entry itself
# A knob PRESENT in an entry wins even when its value is zero (`crf: 0` means 0); a knob
# ABSENT from it inherits. `holdfast validate` prints what each root actually resolved
# to, and which layer supplied each value, so you never have to work it out from here.
#
# A root may override ONLY these: encoder, crf, preset, pixel_format, container_ext,
# min_bitrate_kbps, min_savings_percent, skip_hardlinked, vmaf_enable, min_vmaf,
# vmaf_min_pool, vmaf_min_chroma, vmaf_subsample, vmaf_model. Anything else inside an
# entry refuses to start: workers, state_dir, server_*, undo_window_hours,
# history_retention_rows, run_window, max_load and the notification keys describe the
# PROCESS, not a library, and stay at the top level.
#
# NO ROOT MAY CONTAIN ANOTHER. Nesting is refused rather than resolved by a precedence
# rule, because a file under two roots would have two answers to what may be done to it.
library_roots:
  # A plain path: this root, every setting below.
  - /mnt/media
  # The same list, with a root that decides its own. A 22 that is right for a film is
  # wasteful on a 22-minute sitcom, and grain and dark scenes are where an honest encode
  # dips lowest - so this one encodes a little harder and accepts a lower worst frame,
  # while inheriting the encoder, the preset and everything else from the top level.
  - path: /mnt/anime
    crf: 20
    vmaf_min_pool: 45

# Log verbosity: debug | info | warn | error  (default: info)
log_level: info

# When true, report intended actions without changing any file: every guard runs, and
# nothing is encoded, swapped or deleted. A file that passes every guard is RECORDED as
# `would-transcode` - a terminal outcome that says what a real run would do to it,
# carrying that file's source codec and source size - so the dashboard, /api/history and
# holdfast_files_total{outcome="would-transcode"} answer "which files would this
# transcode?" instead of leaving them looking like work still in progress.
#
# It is a decision about a scan, not a disposal of the file: turning this back off and
# running again transcodes exactly the files that list named.
dry_run: false

# --- what to scan ---
# File extensions considered (case-insensitive).
# video_exts: [mkv, mp4, avi, mov, m4v, ts, m2ts, wmv, flv]

# --- codec / quality: the codec matrix (TRANSCODE-6) ---
# encoder: cpu           # cpu (libx265/hevc) is the ARCHIVAL DEFAULT — best
#                         # quality-per-bit, always available, no external device.
#                         # Everything else is opt-in, for draining a backlog
#                         # faster at a lower quality-per-bit:
#                         #   svtav1     libsvtav1  -> av1   (CPU, no device needed)
#                         #   nvenc      hevc_nvenc -> hevc  (needs an NVIDIA GPU)
#                         #   av1_nvenc  av1_nvenc  -> av1   (needs an NVIDIA GPU)
#                         #   qsv        hevc_qsv   -> hevc  (needs Intel Quick Sync)
#                         #   vaapi      hevc_vaapi -> hevc  (needs a VAAPI device,
#                         #                                   e.g. /dev/dri/renderD128)
#                         #   amf        hevc_amf   -> hevc  (needs an AMD GPU)
#                         # The raw ffmpeg -c:v codec name (e.g. libsvtav1) also
#                         # works as an alias for its short key.
#                         #
#                         # CAPABILITY CHECK: at `run` startup the configured
#                         # encoder is actually exercised against a tiny real clip
#                         # (not just an exit-code check — a hardware encoder can
#                         # exit 0 while writing nothing when no device is
#                         # present). If it's not available in this ffmpeg build /
#                         # on this host, `run` FAILS LOUD and exits non-zero —
#                         # it never silently falls back to cpu.
#                         #
#                         # Whichever encoder produces the output, it is verified
#                         # against the EXACT SAME no-loss gate as cpu: correct
#                         # codec, duration/packet parity, strictly-smaller,
#                         # stream-count parity, full decode-integrity, and VMAF.
#                         # A hardware/av1 encode that fails any gate is rejected
#                         # and the source is kept — no encoder is special-cased.
# crf: 22                # quality knob (lower = bigger/better): libx265/libsvtav1
#                         # constant-rate-factor, or reused as the CQ/
#                         # global_quality/QP target for nvenc/qsv/vaapi/amf.
# preset: slow           # speed/quality preset. A libx265 preset word for cpu;
#                         # mapped to SVT-AV1's numeric 0-13 scale for svtav1
#                         # (slow -> 6, medium -> 8, fast -> 10; unrecognized
#                         # words fall back to 8). Ignored by the hardware
#                         # encoders.
#
# AV1/hardware HDR limitation: HDR10 static metadata (the mastering-display +
# MaxCLL block) is carried through the encode ONLY for cpu (libx265's
# -x265-params mechanism). svtav1 and every hardware encoder still carry the
# colour PRIMARIES/TRANSFER/MATRIX/RANGE tags (via the universal -color_* flags)
# but NOT the mastering-display block — AV1 static-metadata carriage would need
# svt-av1-params mastering-display/content-light options, which is out of scope
# here. This mirrors the pre-existing NVENC limitation the original bash
# transcoder already documented; a source needing full HDR10 static-metadata
# carriage should stay on encoder: cpu.

# pixel_format: auto     # "auto" (default): derive per source — preserve chroma
#                         # subsampling (4:2:0/4:2:2/4:4:4), floor bit-depth at 10
#                         # (8-bit -> 10-bit; 10/12/16-bit sources keep their own
#                         # depth). An exotic/unrecognized source pix_fmt is
#                         # SKIPPED, never silently subsampled. Set a literal value
#                         # (e.g. yuv420p10le) to force that pix_fmt for every
#                         # source instead (TRANSCODE-1 back-compat behaviour).

# container_ext: source  # "source" or "auto" (default, equivalent): output
#                         # container = the SOURCE file's own extension, so the
#                         # transcode happens in place (mp4 -> mp4, mkv -> mkv).
#                         # This avoids force-migrating a container whose stream
#                         # types don't round-trip elsewhere (e.g. an MP4 with
#                         # mov_text subtitles into MKV, which can't carry them).
#                         # Set a literal value (e.g. mkv) to force that extension
#                         # for every source instead — the collision guard (never
#                         # clobber a distinct existing file at the target name)
#                         # still applies whenever the effective extension differs
#                         # from the source's own.

# --- HDR / colour + source-property fidelity (TRANSCODE-3; not separately
# configurable — always on) ---
# SKIPPED, never silently converted:
#   - an interlaced source (field_order tt/bb/tb/bt) — this tool never deinterlaces
#   - Dolby Vision (codec tag dvhe/dvh1/dvav/dav1, or a DOVI configuration record)
#     — the RPU cannot survive a generic re-encode
#   - HDR10+ (SMPTE2094-40 dynamic metadata) — cannot survive a generic re-encode
#   - an HDR10 source whose mastering-display or content-light block is PRESENT
#     but unparseable — re-encoding would silently drop metadata that IS there
#   - a source with an exotic/unrecognized pixel format (see pixel_format above)
# PRESERVED through the encode, never flattened or invented:
#   - HDR10 static metadata (mastering-display SMPTE ST 2086 + MaxCLL/FALL) and the
#     colour primaries/transfer/matrix/range tags — an SDR source is never wrongly
#     tagged HDR, and an HDR source never has metadata invented that it didn't signal
#   - 4:2:2 / 4:4:4 chroma subsampling (not flattened to 4:2:0)
#   - variable frame-rate timing (`-fps_mode passthrough` — not forced to CFR)

# --- data-safety guards (do not loosen without understanding them) ---
# min_bitrate_kbps: 2500     # skip sources below this — re-encoding them only bloats
# min_savings_percent: 0     # accept only if output <= input*(1-this/100); 0 = strictly smaller
# duration_tolerance_sec: 1  # reject if output duration drifts more than this
# max_failures: 3            # attempts to spend on a failure that MAY come out differently
# skip_hardlinked: true      # skip files with >1 hard link (an active seed/dup)
#
# max_failures BOUNDS THE RETRIES THAT ARE WORTH SOMETHING, and only those. It governs a
# failure a later attempt could answer differently - a full disk, an OOM-killed encoder, a
# store error - and such a file is retried up to this many times before it is parked.
#
# A failure this configuration makes FINAL is not retried at all: it parks the file at its
# FIRST occurrence. Most of what the gate rejects is a pure function of the source bytes,
# these settings and the pinned ffmpeg build - an output that came out bigger than its
# source, one that is not the target codec, a truncated encode, a dropped track, a VMAF or
# chroma floor - so attempts two and three would each pay a full encode (hours, on a
# feature-length source at preset slow) to reach the identical rejection. The row says so:
# its reason names the gate that rejected the file AND states that the verdict is final.
#
# Final means final UNDER THIS CONFIGURATION, never "this file is hopeless". Change what
# the verdict depends on - min_savings_percent, the encoder, crf/preset, a VMAF floor - and
# it is a different question, to be asked again.

# --- VMAF perceptual-quality gate (the last no-loss layer) ---
# After the structural checks pass, VMAF compares the output against the source and
# REJECTS an encode that decodes fine but looks worse. When enabled and libvmaf is
# unavailable (or the measurement fails), the encode is rejected — never accept an
# unmeasured output. VMAF is a second full decode; raise vmaf_subsample on big libraries.
#
# THE GATE IS THREE NUMBERS, AND YOU NEED ALL OF THEM.
#   min_vmaf        bounds the AVERAGE quality of the encode.
#   vmaf_min_pool   bounds the WORST part of it.
#   vmaf_min_chroma bounds its COLOUR, which the other two cannot see at all.
# An average hides local damage — Netflix says so outright: mean pooling "has the risk
# of hiding poor quality frames". Measured on real libvmaf against these defaults: an
# encode with ~1% of its frames destroyed (VMAF ~35) still pools to a harmonic mean
# above 95 and PASSES. In a 2-hour film that is over a minute of ruined video — and it
# passes every structural check too, because a destroyed segment still decodes cleanly
# and still carries the right duration, packets and streams. The source is then deleted.
# vmaf_min_pool is what catches that. Turning it off restores the blind spot.
#
# The VMAF model is LUMA-ONLY, so neither of those two numbers looks at colour at all,
# and neither does any structural check. Measured on real libvmaf: an output whose
# chroma planes were desaturated by 15% pools to a harmonic mean of ~99 with a worst
# frame of ~97 - it clears both floors above with room to spare, decodes perfectly,
# carries the right duration, packets and streams, and its colour is wrong. Its chroma
# PSNR reads ~26 dB where a faithful encode of the same source reads ~40 dB.
# vmaf_min_chroma is what catches that.
#
# vmaf_enable: true          # turn the gate on/off
# min_vmaf: 95               # reject if the pooled harmonic-mean VMAF < this (the AVERAGE)
# vmaf_min_pool: 60          # reject if the worst frame's VMAF < this (the FLOOR; 0 = off, not advised)
# vmaf_min_chroma: 30        # reject if the worst frame's CHROMA PSNR (dB, the worse of Cb and Cr)
#                            # < this. Range 0-100 dB; 0 = off, which leaves chroma damage
#                            # entirely unguarded and warns at startup. Out of range, or a
#                            # misspelled key, refuses to start rather than silently
#                            # falling back to the default.
# vmaf_subsample: 1          # frame-sampling interval (1 = every frame; higher = cheaper, but it
#                            # WEAKENS both worst-frame floors above: an unsampled frame is an
#                            # unseen frame)
# vmaf_model: auto           # auto = vmaf_4k for height>1440 else HD; or a model version/spec.
#                            # Checked AT STARTUP: a model this ffmpeg build cannot load stops
#                            # the run before the first encode instead of after the last one.
#
# If honest encodes are being rejected: LOWER the floor, do not switch it off. The worst
# frame of a faithful encode sits far above 60 even on the content VMAF handles worst
# (dark, grainy) — but grain and very dark scenes are where a legitimate encode dips
# lowest, so 45 is a reasonable retreat if your library is full of them. `vmaf_min_pool:
# 45` still bounds how bad any single frame may get. `vmaf_min_pool: 0` bounds nothing,
# and hands you back the blind spot described above. The same applies to the chroma
# floor: 25 is a reasonable retreat, 0 bounds nothing.
#
# What the score does NOT mean: VMAF is a regression onto a subjective opinion scale, not
# a measure of signal identity — 100 is a scale anchor, not "identical to the source", and
# a bit-identical file is not guaranteed to score it. A pass means "no worse than this
# against your source, under this model" and nothing stronger. The VMAF model is
# LUMA-ONLY - vmaf_min_chroma above is what covers colour - and it is documented-weak on
# banding and dark scenes.
#
# Which pixels were compared. holdfast NAMES one pixel format for the comparison and
# converts both streams to it before scoring: the richer chroma subsampling of the two
# and the deeper of the two bit depths, so nothing is averaged or quantised away on the
# way in. It matters because `pixel_format: auto` floors output depth at 10, so an 8-bit
# source and its replacement routinely disagree, and upconverting the source is not the
# same measurement as downconverting the output. The format used is recorded beside the
# score everywhere it appears - the log line, the ledger row and the API - so a passing
# score says which pixels were compared rather than leaving it to ffmpeg's filter
# negotiation and nobody's notes.

# --- the undo window (a swap you can walk back) ---
# The swap is the ONE irreversible thing holdfast does, and every gate in front of it
# is an estimate - a very good one, but still a machine's verdict that two files look
# the same. The delete is not an estimate.
#
# With undo_window_hours > 0, holdfast takes a second hard link to the original just
# before the rename, so the original's bytes stay retrievable after the swap has taken
# its only other name away:
#
#   holdfast restore --config config.yaml            # what is held, and for how long
#   holdfast restore --config config.yaml /media/tv/ep.mkv
#
# What it costs. NOTHING at the moment it is taken - a second name for the same data
# is not a second copy. But the space a swap reclaimed does NOT come back until the
# window closes: a first pass over a library holds every original it replaced for this
# many hours. The API reports what is held separately from what was reclaimed, so the
# two are never confused. A release returns the file's space only when the retained
# name was the last one, and reports zero when it was not.
#
# 0 (THE DEFAULT) disables it: the rename destroys the source and nothing retains it.
# `validate` and startup both say so out loud. A source whose original cannot be
# retained is SKIPPED rather than swapped, so the window never becomes a promise that
# quietly is not kept.
# undo_window_hours: 0       # 0 = off (default); e.g. 24 keeps an original for a day

# --- what a swap carries from the source ---
# The replacement is written by ffmpeg under holdfast's own umask and uid:gid, and the
# rename then publishes it under the source's name. holdfast carries the source's mode,
# its ownership (only where it is privileged to - a container running as an ordinary
# `user:` has no CAP_CHOWN, and says so once per run) and its modification time across,
# so reclaiming disk does not quietly rewrite your library's permissions and its ordering.
# ACLs and xattrs are NOT carried; docs/docker.md says so in full.
#
# preserve_mtime is the one part of that you can turn off, and it DEFAULTS TO ON.
# Resetting a file's mtime is a real and unrecoverable change to a media server: Plex's and
# Jellyfin's "Recently Added", and every date-based sort and smart collection built on it,
# sees a first pass over a library as the entire library arriving at once. Every
# neighbouring tool (cp -p, rsync -a, mv) preserves the modification time across a
# replacement, so preserving it is the least-surprising behaviour and RESETTING it is the
# side effect. Set it to false if you would rather the replacement's mtime say when the
# bytes were actually written - that is a legitimate meaning, and it is why the key exists.
#
# Either way a resume still works: the swap always makes the file smaller, so the
# size:mtime identity holdfast keys a completed file under moves whatever this is set to.
# preserve_mtime: true       # true = the replacement keeps the source's modification time

# --- runtime ---
# state_dir: state           # holds the resumable SQLite job store (jobs.db)
#
# history_retention_rows: 0  # THE LEDGER'S SIZE BOUND, AND IT SHIPS DISABLED.
#                            #   0 (the default, and what an absent key means) keeps EVERY
#                            #   terminal row: done, skipped and failed, for ever. A value
#                            #   n > 0 is the maximum number of terminal rows kept; after
#                            #   each scan the oldest beyond it are DELETED.
#                            #
#                            #   A PRUNE CANNOT BE UNDONE. Those rows are the record of
#                            #   what holdfast did to your library after it deleted your
#                            #   originals, and no re-run recreates them: a later scan
#                            #   re-derives the file's CURRENT state instead, so a pruned
#                            #   "done" row for a file still on disk comes back as a
#                            #   "skipped / already-at-target-codec" row - proof that the
#                            #   file is at the target codec, not proof that holdfast put
#                            #   it there. Export first if the record matters to you:
#                            #     holdfast export --config config.yaml --out ledger.ndjson
#                            #
#                            #   What a prune will NOT do, whatever you set here: it never
#                            #   lowers the lifetime reclaimed total (a removed row's
#                            #   contribution is carried forward durably before the row
#                            #   goes), it never touches a media file, and it never causes
#                            #   a file to be encoded again. That last one is why a row is
#                            #   only removed when the scan LISTED the directory its file
#                            #   should be in and the file was not there: a terminal row is
#                            #   what holds that file out of the encoder, so deleting one
#                            #   for a file you still have re-encodes it as soon as the
#                            #   configuration it was decided under has moved.
#                            #   SO THE LEDGER CAN SIT ABOVE THIS BOUND, and on a library
#                            #   that is not churning a pass may remove nothing at all:
#                            #   there is one row per file you own and every one of them is
#                            #   load-bearing. This bounds what your library has FINISHED
#                            #   with. The pass logs what it kept and why.
#                            #   IT ALSO NEVER TOUCHES THE UNDO WINDOW: a retained
#                            #   original is a file that is still there, so the row for
#                            #   the swap that produced it stays, the retention record
#                            #   lives in its own table a prune never writes, and a row
#                            #   left by `holdfast restore` is kept for as long as the
#                            #   restored file is. Setting this key cannot cost you a
#                            #   restore, and a prune returns no space, so it does not
#                            #   move what the window reports holding either.
#                            #   A negative or fractional value is a startup REFUSAL.
#                            #   The bound is a row count only: there is no age-based or
#                            #   per-status policy, and pruning does not shrink jobs.db on
#                            #   disk (no VACUUM) - it bounds the rows, not the file.
# workers: 1                 # concurrent encode workers (default 1 = sequential;
#                             # CPU libx265 already saturates cores per encode, so
#                             # raising this is an opt-in for many small/low-res files)

# --- storage that is not local ---
# holdfast's no-loss contract is stated for a LOCAL filesystem: an atomic
# same-filesystem rename whose failure means it did not happen, a stat that can see
# a concurrent rewrite, a SQLite WAL that works at all. None of those hold on a NAS.
# So at startup it classifies every path this run would act on - every library root,
# the state directory, and every filesystem mounted beneath a root - and REFUSES the
# whole run unless you have said, per path, that you accept the reduced guarantee.
# It prints the exact line to add, so you never have to guess the spelling.
#
# Each entry names ONE path and covers that path alone (never a global switch), and
# must be a configured library root, the state directory, or a path spelled beneath
# a library root AS CONFIGURED. An entry that covers nothing is reported as
# unnecessary; an entry naming something else refuses the run as malformed rather
# than being silently ignored. It never permits a path holdfast cannot INSPECT.
# See docs/filesystem.md.
# allow_non_local:
#   - /media/tv
#   - /state

# --- HTTP API + web UI (`holdfast serve`) ---
# `holdfast serve` runs a REST API + SSE live stream + an embedded web dashboard
# (single binary). It is a READ-AND-CONTROL surface: this YAML stays the source of
# truth, and the API can only start a scan and pause/resume new-file feeding — it
# never touches a media file.
# server_addr: 127.0.0.1:8080  # bind address. LOCALHOST by default (fail-safe: the
#                              #   control surface is not network-exposed unless you
#                              #   opt in — then front it with a reverse proxy).
# server_auth_token: ""        # bearer token required for the MUTATING endpoints
#                              #   (rescan/pause/resume). Empty = those endpoints are
#                              #   DISABLED (read-only). Prefer the environment
#                              #   variable HOLDFAST_SERVER_AUTH_TOKEN so no secret
#                              #   lands in this file.
# scan_interval_sec: 0         # 0 = scan once on startup + on demand (via the API).
#                              #   >0 = also re-scan every N seconds.

# --- observability + host-fair scheduling (`holdfast serve`) ---
# metrics_enable: true         # expose Prometheus metrics at /metrics (read-only
#                              #   instrumentation; best-effort, never affects files)
# notify_url: ""               # a shoutrrr service URL for best-effort notifications
#                              #   (per-file failure + per-scan summary), e.g.
#                              #   ntfy://ntfy.sh/mytopic or a Discord/Gotify URL.
#                              #   Empty disables. May carry a secret — prefer the env
#                              #   var HOLDFAST_NOTIFY_URL over this file.
# run_window: ""               # daily host-fair window "HH:MM-HH:MM" (local time)
#                              #   during which new work may start; empty = always.
#                              #   Outside it, serve stops feeding NEW files (an
#                              #   in-flight encode always finishes) — it only DELAYS.
# max_load: 0                  # per-core 1-min load-average cap; while the host is
#                              #   above it, stop feeding new files. 0 disables.
# tautulli_url: ""             # optional Plex-aware pause: while Tautulli reports an
# tautulli_api_key: ""         #   active stream, stop feeding new files. Both required
#                              #   to enable; a Tautulli outage fails OPEN (never halts
#                              #   transcoding). Prefer env vars for the API key.
